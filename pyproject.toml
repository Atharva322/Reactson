[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reactson"
version = "0.1.0"
description = "Reactson self-evolving AI agent runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Reactson contributors" }]
keywords = ["ai-agent", "planning", "memory", "mcts", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "pydantic>=2"]
memory = ["neo4j>=5.20", "qdrant-client>=1.9"]
dev = ["pytest>=8"]

[project.scripts]
reactson = "reactson.cli:main"
reactson-health = "reactson.cli:health_main"

[tool.setuptools.packages.find]
include = ["reactson*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
